<!DOCTYPE html>
<html>
<head>
    <title>Generate Icons</title>
</head>
<body>
    <canvas id="icon16" width="16" height="16"></canvas>
    <canvas id="icon48" width="48" height="48"></canvas>
    <canvas id="icon128" width="128" height="128"></canvas>
    <script>
        function drawIcon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#4CAF50';
            ctx.fillRect(0, 0, size, size);
            
            // Text bubble shape
            ctx.fillStyle = 'white';
            const padding = size * 0.2;
            ctx.beginPath();
            ctx.moveTo(padding, padding);
            ctx.lineTo(size - padding, padding);
            ctx.lineTo(size - padding, size - padding * 1.5);
            ctx.lineTo(size - padding * 1.5, size - padding * 1.5);
            ctx.lineTo(size - padding * 2, size - padding);
            ctx.lineTo(padding, size - padding * 1.5);
            ctx.closePath();
            ctx.fill();
            
            // AI text
            ctx.fillStyle = '#4CAF50';
            ctx.font = `bold ${size * 0.4}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('AI', size / 2, size / 2);
            
            // Convert to PNG and download
            const link = document.createElement('a');
            link.download = `icon${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
        
        // Generate all icons
        drawIcon('icon16', 16);
        drawIcon('icon48', 48);
        drawIcon('icon128', 128);
    </script>
</body>
</html>
